<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1013">
<title>Аккорды Rocksmith</title>
<style>@font-face{font-family:Onest;font-style:normal;font-display:swap;font-weight:400;src:url(fonts/onest-cyrillic-400-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}@font-face{font-family:Onest;font-style:normal;font-display:swap;font-weight:500;src:url(fonts/onest-cyrillic-500-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}@font-face{font-family:Onest;font-style:normal;font-display:swap;font-weight:600;src:url(fonts/onest-cyrillic-600-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}@font-face{font-family:Onest;font-style:normal;font-display:swap;font-weight:700;src:url(fonts/onest-cyrillic-700-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}@font-face{font-family:Onest;font-style:normal;font-display:swap;font-weight:800;src:url(fonts/onest-cyrillic-800-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}@font-face{font-family:Onest;font-style:normal;font-display:swap;font-weight:400;src:url(fonts/onest-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}@font-face{font-family:Onest;font-style:normal;font-display:swap;font-weight:500;src:url(fonts/onest-latin-500-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}@font-face{font-family:Onest;font-style:normal;font-display:swap;font-weight:600;src:url(fonts/onest-latin-600-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}@font-face{font-family:Onest;font-style:normal;font-display:swap;font-weight:700;src:url(fonts/onest-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}@font-face{font-family:Onest;font-style:normal;font-display:swap;font-weight:800;src:url(fonts/onest-latin-800-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}</style>
<style>
:root{
  --bg:#0f1013;--s1:#17191e;--s2:#1e2127;--s3:#282c34;--line:#2c3038;--line2:#3a3f49;
  --tx:#eef0f3;--mut:#9aa1ad;--dim:#6b717c;--acc:#ff9f1c;--acc-ink:#1a1206;--ok:#5bd17a;--bad:#ff6b6b;
  --r:14px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Onest,system-ui,sans-serif;font-size:15px;line-height:1.35}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
header.top{position:sticky;top:0;z-index:20;background:rgba(15,16,19,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:calc(8px + var(--safe-t)) 14px 8px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.brand svg{flex:none}
.nav{display:flex;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;margin-left:auto}
.nav button{padding:7px 12px;border-radius:9px;font-weight:600;font-size:14px;color:var(--mut);white-space:nowrap}
.nav button.on{background:var(--s3);color:var(--tx)}
.nav .cnt{font-size:11px;background:var(--line2);border-radius:99px;padding:1px 6px;margin-left:4px;color:var(--tx)}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--dim);display:block}
.sync.cloud i{background:var(--ok)} .sync.busy i{background:var(--acc)} .sync.err i{background:var(--bad)}
@media (max-width:560px){.brand span{display:none}.sync b{display:none}.nav button{padding:7px 10px}}

main{padding:12px 14px calc(140px + var(--safe-b));max-width:1500px;margin:0 auto}

/* filters */
.sbar{position:sticky;top:calc(56px + var(--safe-t));z-index:15;background:var(--bg);margin:0 -14px;padding:8px 14px 8px}
.filters{padding:2px 0 6px}
.search{position:relative}
.search input{width:100%;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:12px 40px 12px 42px;font-size:16px;outline:none}
.search input:focus{border-color:var(--acc)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--dim)}
.search .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:8px;color:var(--mut);font-size:20px}
.row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-bottom:6px}
.row::-webkit-scrollbar{display:none}
@media (min-width:900px){.row{flex-wrap:wrap;overflow:visible}}
.chip{flex:none;border:1px solid var(--line);background:var(--s1);color:var(--mut);border-radius:99px;padding:6px 12px;font-size:14px;font-weight:600;white-space:nowrap}
.chip small{font-weight:500;opacity:.7;margin-left:3px;font-size:11px}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.chip.on small{opacity:.8}
.rowlbl{flex:none;align-self:center;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);padding-right:4px;width:54px}
.resinfo{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:13px;margin:2px 0 10px}
.resinfo button{color:var(--acc);font-weight:600}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
@media (min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}}
.card{-webkit-touch-callout:none;position:relative;background:var(--s1);border:1.5px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:border-color .15s,transform .1s;user-select:none}
.card:active{transform:scale(.985)}
.card img{display:block;width:100%;aspect-ratio:2/1;height:auto;background:#1b1b1d}
.card .meta{display:flex;align-items:flex-start;gap:6px;padding:8px 8px 9px 11px}
.card .nm{font-weight:800;font-size:18px;letter-spacing:-.01em;line-height:1.1}
.card .sub{font-size:12px;color:var(--mut);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.card .shape{font-family:var(--mono);letter-spacing:.06em}
.tag{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);background:var(--s3);border-radius:5px;padding:2px 5px}
.tag.fix{background:#3b2a12;color:var(--acc)}
.card .info{margin-left:auto;flex:none;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--mut)}
.card .info:hover{background:var(--s3)}
.card .fav{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;opacity:.0;background:rgba(0,0,0,.45);font-size:16px}
.card .fav.on{opacity:1;color:var(--acc)}
.card:hover .fav{opacity:1}
.card.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.card .ord{position:absolute;top:6px;left:6px;min-width:26px;height:26px;border-radius:99px;background:var(--acc);color:var(--acc-ink);font-weight:800;font-size:13px;display:none;place-items:center;padding:0 7px}
.card.sel .ord{display:grid}
.empty{color:var(--mut);text-align:center;padding:48px 10px}
.foot{color:var(--dim);font-size:12.5px;margin:28px 0 0;line-height:1.55}
.foot b{color:var(--mut);font-weight:600}
.legend{display:inline-flex;gap:4px;vertical-align:middle;margin:0 2px}
.legend i{width:14px;height:4px;border-radius:2px;display:block;margin-top:2px}

/* tray */
.tray{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(23,25,30,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line2);padding:10px 14px calc(10px + var(--safe-b));box-shadow:0 -10px 30px rgba(0,0,0,.35)}
.tray .in{max-width:1500px;margin:0 auto}
.tray .head{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);margin-bottom:8px}
.tray .head b{color:var(--tx);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tray .head .lnk{color:var(--mut);text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.tray .chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:9px}
.tray .chips::-webkit-scrollbar{display:none}
.tchip{flex:none;display:flex;align-items:center;gap:6px;background:var(--s3);border-radius:9px;padding:6px 6px 6px 10px;font-weight:700;font-size:14px}
.tchip button{width:22px;height:22px;border-radius:6px;color:var(--mut);font-size:16px;line-height:1}
.tchip button:hover{background:var(--line2);color:var(--tx)}
.tray .acts{display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:11px;padding:11px 16px;font-weight:700;font-size:15px;background:var(--s3);border:1px solid var(--line2);white-space:nowrap}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:9px}
.btn:disabled{opacity:.45}
.tray .acts .pri{flex:1}

/* sets */
.sets-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 12px}
.sets-head h2{margin:0;font-size:22px;letter-spacing:-.01em}
.setgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.group-h{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);margin:22px 0 10px;font-weight:700}
.scard{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.scard.cur{border-color:var(--acc)}
.scard .t{display:flex;align-items:flex-start;gap:8px}
.scard h3{margin:0;font-size:17px;font-weight:800;flex:1;word-break:break-word}
.scard .note{color:var(--mut);font-size:13px;white-space:pre-wrap;word-break:break-word}
.scard .mini{display:flex;flex-wrap:wrap;gap:5px}
.scard .mini span{background:var(--s3);border-radius:7px;padding:3px 8px;font-weight:700;font-size:13px}
.scard .row2{display:flex;gap:8px;flex-wrap:wrap}
.kebab{width:34px;height:34px;border-radius:9px;color:var(--mut);display:grid;place-items:center;flex:none}
.kebab:hover{background:var(--s3)}

/* stage */
.stage{position:fixed;inset:0;z-index:50;background:#0a0b0d;display:flex;flex-direction:column}
.stage .bar{display:flex;align-items:center;gap:8px;padding:calc(8px + var(--safe-t)) 10px 8px;background:#121318;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;flex:none}
.stage .bar::-webkit-scrollbar{display:none}
.stage .bar .ttl{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw;margin-right:auto;padding-left:4px}
.seg{display:flex;background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:2px;flex:none}
.seg button{min-width:32px;padding:6px 8px;border-radius:8px;font-weight:700;font-size:13px;color:var(--mut)}
.seg button.on{background:var(--s3);color:var(--tx)}
.tbtn{flex:none;height:36px;padding:0 11px;border-radius:10px;background:var(--s1);border:1px solid var(--line);font-weight:600;font-size:13px;color:var(--mut);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tbtn.on{color:var(--acc-ink);background:var(--acc);border-color:var(--acc)}
.stage.noui .bar{display:none}
.board{flex:1;overflow:auto;padding:12px;display:grid;gap:var(--gap,12px);align-content:center;justify-content:center}
.board.scroll{align-content:start}
.tile{position:relative;width:var(--w);background:#16171b;border-radius:12px;overflow:hidden;border:1px solid #23252b}
.tile .lbl{height:calc(var(--w) * var(--lh));display:flex;align-items:center;gap:.5em;padding:0 calc(var(--w) * .04);overflow:hidden}
.tile .lbl .n{font-weight:800;font-size:calc(var(--w) * .085);letter-spacing:-.01em;white-space:nowrap}
.tile .lbl .a{font-weight:600;font-size:calc(var(--w) * .045);color:var(--mut);white-space:nowrap}
.tile .lbl .nt{margin-left:auto;font-size:calc(var(--w) * .04);color:var(--mut);white-space:nowrap}
.tile img{display:block;width:100%;height:auto;aspect-ratio:2/1}
.tile .ed{position:absolute;inset:0;display:none;align-items:flex-start;justify-content:flex-end;gap:6px;padding:8px;background:rgba(0,0,0,.25)}
.stage.edit .tile .ed{display:flex}
.tile .ed button{width:40px;height:40px;border-radius:10px;background:rgba(20,21,25,.92);border:1px solid var(--line2);font-size:18px;font-weight:700}
.tile .ed button.x{color:var(--bad)}
.stage .hint{position:absolute;bottom:calc(12px + var(--safe-b));left:50%;transform:translateX(-50%);background:rgba(30,33,39,.92);color:var(--mut);font-size:12.5px;padding:6px 12px;border-radius:99px;pointer-events:none;transition:opacity .4s}
.stage .empty-st{margin:auto;color:var(--mut);text-align:center;padding:30px}

/* modal */
.modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--s2);border:1px solid var(--line2);border-radius:18px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:18px}
@media (max-width:560px){.modal{align-items:flex-end;padding:0}.sheet{border-radius:18px 18px 0 0;padding-bottom:calc(18px + var(--safe-b));max-height:92vh}}
.sheet h3{margin:0 0 4px;font-size:20px}
.sheet .lead{color:var(--mut);font-size:14px;margin:0 0 14px}
.sheet img{width:100%;height:auto;aspect-ratio:2/1;display:block;border-radius:12px;margin:6px 0 12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin-bottom:14px}
.kv dt{color:var(--mut)} .kv dd{margin:0;font-weight:600}
.kv .mono{font-family:var(--mono);letter-spacing:.08em}
.fixnote{background:#2b2212;border:1px solid #4a3613;color:#ffd08a;border-radius:10px;padding:10px 12px;font-size:13.5px;margin-bottom:14px}
.sheet .acts{display:flex;gap:8px;flex-wrap:wrap}
.sheet .acts .btn{flex:1}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:13px;color:var(--mut);margin-bottom:5px}
.field input,.field textarea{width:100%;background:var(--s1);border:1px solid var(--line2);border-radius:10px;padding:11px 12px;font-size:16px;outline:none}
.field textarea{min-height:70px;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--acc)}
.setpick{display:flex;flex-direction:column;gap:6px;margin:4px 0 14px;max-height:40vh;overflow:auto}
.setpick label{display:flex;align-items:center;gap:10px;background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-weight:600}
.setpick input{width:20px;height:20px;accent-color:var(--acc)}
.setpick small{margin-left:auto;color:var(--dim);font-weight:500}
.menu{display:flex;flex-direction:column;gap:6px}
.menu .btn{justify-content:flex-start}

.toast{position:fixed;left:50%;bottom:calc(150px + var(--safe-b));transform:translateX(-50%);z-index:90;background:#2b2f37;border:1px solid var(--line2);color:var(--tx);padding:10px 16px;border-radius:12px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:calc(100vw - 32px);text-align:center}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg width="26" height="22" viewBox="0 0 26 22" aria-hidden="true"><rect x="0" y="1" width="26" height="2" rx="1" fill="#ff5a6e"/><rect x="0" y="5" width="26" height="2" rx="1" fill="#ffd21f"/><rect x="0" y="9" width="26" height="2" rx="1" fill="#3aa8ff"/><rect x="0" y="13" width="26" height="2" rx="1" fill="#ff9f1c"/><rect x="0" y="17" width="26" height="2" rx="1" fill="#5bd17a"/><rect x="0" y="21" width="26" height="1.5" rx=".75" fill="#c45bff"/></svg>
    <span>Аккорды</span>
  </div>
  <nav class="nav" id="nav">
    <button data-act="view" data-v="catalog">Каталог</button>
    <button data-act="view" data-v="sets">Подборки<span class="cnt" id="setcnt">0</span></button>
  </nav>
  <div class="sync" id="sync" title=""><i></i><b id="synctx">на устройстве</b></div>
</header>

<main id="main"></main>

<div class="tray" id="tray" hidden></div>
<div class="stage" id="stage" hidden></div>
<div class="modal" id="modal" hidden></div>

function sanitizeLib(x){
  return {v:1,updated:+x.updated||0,
    favs:(Array.isArray(x.favs)?x.favs:[]).filter(id=>BY[id]),

let db=null,libRef=null,syncMode='local',writing=false,dirty=false,wTimer=null,firstTimer=null;
function setSync(mode){
  syncMode=mode;const el=$('#sync');el.className='sync '+({cloud:'cloud',busy:'busy',err:'err'}[mode]||'');
  const t={local:'на устройстве',cloud:'синхронизировано',busy:'сохраняю…',err:'нет связи'}[mode];

}
function scheduleWrite(){
  if(!libRef) return; dirty=true; clearTimeout(wTimer); wTimer=setTimeout(flush,700);
}
async function flush(){
  if(!libRef||writing||!dirty) return;
  writing=true;dirty=false;setSync('busy');
  const body={v:1,updated:lib.updated,favs:lib.favs.slice(),sets:lib.sets.map(s=>({...s,chords:s.chords.slice()}))};
  try{await libRef.set(body);setSync('cloud')}
  catch(e){
    const code=e&&e.code;
    if(code==='unavailable'){dirty=true;setTimeout(flush,1500+Math.random()*1500);setSync('err')}
    else if(code==='quota_exceeded'){setSync('err');toast('Облако переполнено, изменения сохранены только на этом устройстве')}
    else {libRef=null;setSync('local')}
  }
  writing=false; if(dirty&&libRef) scheduleWrite();
}
async function initCloud(){
  if(!window.claude||!claude.use) return;
  try{
    const [d,u]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!d||!u) return;
    const id=await u.id(); if(!id) return;
    db=d; libRef=db.doc('data/users/'+id+'/library');
    firstTimer=setTimeout(()=>{if(syncMode!=='cloud')setSync('err')},10000);
    libRef.onSnapshot(snap=>{
      if(snap.metadata&&snap.metadata.hasPendingWrites) return;
      const fromCache=snap.metadata&&snap.metadata.fromCache;
      if(!fromCache){clearTimeout(firstTimer);if(syncMode!=='busy')setSync('cloud')}
      if(snap.exists){
        const remote=sanitizeLib(snap.data()||{});
        if(remote.updated>lib.updated){
          lib=remote;
          if(S.boardSet){const s=lib.sets.find(x=>x.id===S.boardSet); if(s) S.board=s.chords.slice(); else S.boardSet=null;}
          saveLocal();renderAll();
        } else if(remote.updated<lib.updated && !fromCache){dirty=true;scheduleWrite()}
      } else if(!fromCache && (lib.sets.length||lib.favs.length)){dirty=true;scheduleWrite()}
    },err=>{clearTimeout(firstTimer);libRef=null;setSync(err&&err.code==='unavailable'?'err':'local')});
  }catch(e){}
}

/* ---------- search ---------- */
function norm(s){
  return s.replace(/([A-Ga-g][#b♯♭]?)M(?=$|7|aj|a)/g,'$1maj').replace(/Δ/g,'maj7')
    .toLowerCase().replace(/♯/g,'#').replace(/♭/g,'b').replace(/№/g,'#').replace(/\s+/g,'');
}
function layout(s){let o='';for(const ch of s){const i=RU.indexOf(ch);o+=i>=0?EN[i]:ch}return o}
function rankFor(q){
  // returns Map id->rank (lower = better) for a normalized query
  const out=new Map();
  let vf=null;
  q=q.replace(/(open|откр\w*)/,()=>{vf='open';return''}).replace(/(barre|барр?[еэ]?\w*)/,()=>{vf='barre';return''});
  const okVar=c=>!vf||(vf==='open'?(c.var?c.var==='Open':c.open):(c.var?c.var==='Barre':!c.open));
  if(!q){ if(vf) CH.forEach(c=>okVar(c)&&out.set(c.id,1)); return out; }
  if(/^[x\d()]{3,}$/.test(q)&&/[x\d]{3}/.test(q)){
    CH.forEach(c=>{const sh=c.shape.toLowerCase(); if(sh.startsWith(q)) out.set(c.id,sh===q?0:1)}); return out;
  }
  const qmatch=(rest,qk)=>{let best=null;for(const a of QALIAS[qk]){
      if(rest==='m'&&a.startsWith('ma')) continue;
      if(a===rest){best=0;break} if(a.startsWith(rest)){const r=1+a.length*.01; if(best===null||r<best)best=r}}
    return best};
  const m=q.match(/^([a-g])(#|b)?(.*)$/);
  if(m){
    const pc=(LETTER[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0)+12)%12;
    CH.forEach(c=>{if(c.ri!==pc||!okVar(c))return;const r=qmatch(m[3],c.q);if(r!==null)out.set(c.id,r)});
  }
  if(!out.size){
    CH.forEach(c=>{if(!okVar(c))return;let best=null;for(const a of QALIAS[c.q]){if(!a)continue;if(a===q){best=0;break}if(a.startsWith(q)){const r=1+a.length*.01;if(best===null||r<best)best=r}}if(best!==null)out.set(c.id,best+2)});
  }
  return out;
}
function search(raw){
  const a=norm(raw.trim()); if(!a) return null;
  const r1=rankFor(a), b=layout(a), r2=b!==a?rankFor(b):new Map();
  for(const [k,v] of r2) if(!r1.has(k)||v<r1.get(k)) r1.set(k,v);
  return r1;
}

/* ---------- catalog ---------- */
function filtered(){
  const ranks=search(S.q);
  let list=CH.filter(c=>{
    if(ranks&&!ranks.has(c.id)) return false;
    if(S.root!==null&&c.ri!==S.root) return false;
    if(S.qual&&c.q!==S.qual) return false;
    if(S.pos==='open'&&!c.open) return false;
    if(S.pos==='closed'&&c.open) return false;
    if(S.fav&&!lib.favs.includes(c.id)) return false;
    return true;
  });
  if(ranks) list.sort((a,b)=>(ranks.get(a.id)-ranks.get(b.id))||a.idx-b.idx);
  return list;
}
function chordTags(c){
  let t='';
  if(c.var) t+=`<span class="tag">${c.var==='Open'?'открытый':'баррэ'}</span>`;
  else if(!c.open) t+=`<span class="tag">${c.pos} лад</span>`;
  if(c.fix) t+=`<span class="tag fix">исправлен</span>`;
  return t;

/* ---------- transfer between devices ---------- */
function exportCode(){
  const json=JSON.stringify({app:'chordbook',v:1,favs:lib.favs,sets:lib.sets});
  return 'AKKORDY1:'+btoa(unescape(encodeURIComponent(json)));
}
function transferBox(){
  modal(`<h3>Перенос подборок</h3><p class="lead">Подборки и избранное упаковываются в текстовый код. Отправьте его себе (например в Telegram или заметки) и вставьте на другом устройстве: на телефоне, планшете или в веб-версии.</p>
    <div class="acts" style="margin-bottom:18px"><button class="btn pri" data-act="export" ${lib.sets.length||lib.favs.length?'':'disabled'}>${NATIVE?'Отправить код':'Скопировать код'}</button></div>
    <label class="field"><span>Вставить код с другого устройства</span><textarea id="imp" placeholder="AKKORDY1:…" spellcheck="false" autocapitalize="off"></textarea></label>
    <div class="acts"><button class="btn ghost" data-act="close">Закрыть</button><button class="btn" id="impb">Загрузить</button></div>`,
  el=>el.querySelector('#impb').addEventListener('click',()=>doImport(el.querySelector('#imp').value)));
}
async function doExport(){
  const code=exportCode();
  if(NATIVE){NATIVE.share(code);return}
  try{await navigator.clipboard.writeText(code);toast('Код скопирован. Вставьте его на другом устройстве.')}
  catch(e){const t=$('#imp');if(t){t.value=code;t.select()}toast('Скопируйте код из поля ниже')}
}
function doImport(raw){
  const m=String(raw||'').match(/AKKORDY1:([A-Za-z0-9+/=]+)/);
  if(!m){toast('Не похоже на код подборок');return}
  let d;try{d=JSON.parse(decodeURIComponent(escape(atob(m[1]))))}catch(e){toast('Код повреждён, скопируйте его целиком');return}
  const inc=sanitizeLib({sets:d.sets,favs:d.favs,updated:1});
  let added=0,upd=0;
  inc.sets.forEach(s=>{const i=lib.sets.findIndex(x=>x.id===s.id);
    if(i<0){lib.sets.push(s);added++} else if(s.updated>lib.sets[i].updated){lib.sets[i]=s;upd++}});
  inc.favs.forEach(id=>{if(!lib.favs.includes(id))lib.favs.push(id)});
  const cs=curSet(); if(cs) S.board=cs.chords.slice();
  touchLib();closeModal();renderAll();
  toast(added||upd?`Добавлено подборок: ${added}${upd?`, обновлено: ${upd}`:''}`:'Новых подборок нет, всё уже на месте');
}

function layoutBoard(){

  let cols, w, scroll=false;
  if(S.stage.cols==='auto'){
    let best=0,bc=1;
    for(let c=1;c<=n;c++){const r=Math.ceil(n/c);const wW=(W-(c-1)*gap)/c;const wH=((H-(r-1)*gap)/r-2)/ratio;const ww=Math.min(wW,wH);if(ww>best+0.5){best=ww;bc=c}}
    cols=bc; w=Math.floor(best);
    if(w<150){cols=Math.max(1,Math.floor((W+gap)/(150+gap)));w=Math.floor((W-(cols-1)*gap)/cols);scroll=true}
  } else {
    cols=Math.min(+S.stage.cols,n); w=Math.floor((W-(cols-1)*gap)/cols);
    const rows=Math.ceil(n/cols); scroll=rows*(w*ratio+2)+(rows-1)*gap>H;
  }
  w=Math.min(w,1200);
  b.style.gridTemplateColumns=`repeat(${cols}, ${w}px)`;
  b.style.setProperty('--w',w+'px'); b.style.setProperty('--lh',lh);
  b.classList.toggle('scroll',scroll);
}
async function toggleWake(){
  if(NATIVE){ wake=wake?null:{native:true}; NATIVE.keepScreenOn(!!wake); if(wake) toast('Экран не будет гаснуть, пока открыт этот режим'); renderStage(); return }
  if(wake){try{await wake.release()}catch(e){} wake=null; renderStage(); return}
  try{ wake=await navigator.wakeLock.request('screen'); wake.addEventListener('release',()=>{wake=null;if(S.stage.open)renderStage()}); toast('Экран не будет гаснуть, пока открыт этот режим'); }
  catch(e){ wake=null; toast('Браузер не разрешил держать экран включённым. Можно увеличить тайм-аут экрана в настройках телефона.'); }
  renderStage();
}
async function toggleFull(){
  if(NATIVE){ fsOn=!fsOn; NATIVE.setFullscreen(fsOn); setTimeout(layoutBoard,300); return }
  try{ if(document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen(); setTimeout(layoutBoard,250);}
  catch(e){ toast('Полноэкранный режим недоступен здесь'); }
}

/* ---------- modal / toast ---------- */
function modal(html,mount){const m=$('#modal');m.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;m.hidden=false;mount&&mount(m)}
function closeModal(){const m=$('#modal');m.hidden=true;m.innerHTML=''}
let toastT=null;
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2600)}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const m=$('#modal'); if(e.target===m){closeModal();return}
  const a=e.target.closest('[data-act]'); if(!a) return;
  const act=a.dataset.act, id=a.dataset.id, v=a.dataset.v;
  const set=id?lib.sets.find(s=>s.id===id):null;
  switch(act){
    case 'view': S.view=v; renderMain(); window.scrollTo(0,0); break;
    case 'toggle': toggleChord(id); break;
    case 'info': detail(BY[id]); break;
    case 'fav': case 'dfav': {const i=lib.favs.indexOf(id); i>=0?lib.favs.splice(i,1):lib.favs.push(id); touchLib(); refreshMarks();
      if(S.fav) renderGrid(); if(act==='dfav') detail(BY[id]); if(S.view==='catalog') renderCatalogChipsOnly(); break;}
    case 'dtoggle': toggleChord(id); detail(BY[id]); break;
    case 'dnewset': closeModal(); setForm(null,[id]); break;
    case 'clearq': S.q=''; $('#q').value=''; a.hidden=true; renderGrid(); $('#q').focus(); break;
    case 'root': S.root=v===''?null:+v; renderCatalog(); break;
    case 'qual': S.qual=v||null; renderCatalog(); break;
    case 'pos': S.pos=v; renderCatalog(); break;
    case 'favf': S.fav=!S.fav; renderCatalog(); break;
    case 'reset': Object.assign(S,{q:'',root:null,qual:null,pos:'all',fav:false}); $('#q').value=''; renderCatalog(); break;
    case 'rm': S.board.splice(+a.dataset.i,1); boardChanged(); break;
    case 'mv': {const i=+a.dataset.i,j=i+ +a.dataset.d; if(j<0||j>=S.board.length)break; [S.board[i],S.board[j]]=[S.board[j],S.board[i]]; boardChanged(); break;}
    case 'clearboard': confirmBox('Очистить выбор?','Аккорды уберутся с экрана. Сохранённые подборки не изменятся.','Очистить',()=>{S.board=[];boardChanged()}); break;
    case 'newboard': S.board=[];S.boardSet=null;saveLocal();renderAll();toast('Начат новый выбор. Подборка сохранена.'); break;
    case 'saveboard': setForm(null,S.board); break;
    case 'stage': openStage(); break;
    case 'stclose': closeStage(); break;
    case 'stui': if(e.target.closest('.ed'))break; if(S.stage.edit)break; S.stage.ui=!S.stage.ui; renderStage(); break;
    case 'cols': S.stage.cols=v==='auto'?'auto':+v; saveLocal(); renderStage(); break;
    case 'stnotes': S.stage.notes=!S.stage.notes; saveLocal(); renderStage(); break;
    case 'stedit': S.stage.edit=!S.stage.edit; renderStage(); break;
    case 'stwake': toggleWake(); break;
    case 'stfull': toggleFull(); break;
    case 'newset': setForm(null,[]); break;
    case 'sgroup': S.setGroup=v||null; renderSets(); break;
    case 'setmenu': if(set) setMenu(set); break;
    case 'setrename': if(set){closeModal();setForm(set)} break;
    case 'setdup': if(set){const c={...set,id:uidGen(),name:set.name+' (копия)',chords:set.chords.slice(),updated:Date.now()};lib.sets.push(c);touchLib();closeModal();renderAll();toast('Копия создана')} break;
    case 'setdel': if(set){closeModal();confirmBox('Удалить подборку?',`«${esc(set.name)}» удалится на всех устройствах. Аккорды в каталоге останутся.`,'Удалить',()=>{
      lib.sets=lib.sets.filter(s=>s.id!==set.id); if(S.boardSet===set.id) S.boardSet=null; touchLib(); renderAll();},true)} break;
    case 'setshow': if(set) loadSet(set,()=>{renderAll();openStage()}); break;
    case 'setedit': if(set) loadSet(set,()=>{S.view='catalog';renderAll();window.scrollTo(0,0);toast('Нажимайте на аккорды, чтобы добавить или убрать')}); break;
    case 'close': closeModal(); break;
    case 'transfer': transferBox(); break;
    case 'export': doExport(); break;
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if(!$('#modal').hidden) closeModal(); else if(S.stage.open) closeStage(); }
  if(e.key==='/'&&S.view==='catalog'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){e.preventDefault();$('#q')&&$('#q').focus()}
});
let rT=null; window.addEventListener('resize',()=>{clearTimeout(rT);rT=setTimeout(()=>{if(S.stage.open)layoutBoard()},80)});
document.addEventListener('fullscreenchange',()=>setTimeout(layoutBoard,150));

function renderCatalogChipsOnly(){ const b=document.querySelector('[data-act=favf]'); if(b) b.innerHTML=`★ Избранное${lib.favs.length?`<small>${lib.favs.length}</small>`:''}`; }
function renderMain(){ updateNav(); if(S.view==='catalog'){ if(!$('#main .sbar')) $('#main').innerHTML=''; renderCatalog(); } else renderSets(); }
function renderAll(){ renderMain(); renderTray(); if(S.stage.open) renderStage(); }

loadLocal(); setSync('local'); if(NATIVE) $('#sync').hidden=true; renderAll();
window.appBack=()=>{
  if(!$('#modal').hidden){closeModal();return true}
  if(S.stage.open){closeStage();return true}
  if(S.view!=='catalog'){S.view='catalog';renderMain();window.scrollTo(0,0);return true}
  return false;
};
setTimeout(initCloud,0);
</script>
