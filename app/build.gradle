plugins {
    id 'com.android.application'
}

def ks = new Properties()
file('keystore.properties').withInputStream { ks.load(it) }
def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'ua.chordbook.app'
    compileSdk 35

    defaultConfig {
        applicationId 'ua.chordbook.app'
        minSdk 26
        targetSdk 35
        versionCode runNumber
        versionName "1.0.${runNumber}"
    }

    signingConfigs {
        release {
            storeFile file('release.jks')
            storePassword ks.getProperty('storePassword')
            keyAlias 'akkordy'
            keyPassword ks.getProperty('storePassword')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
